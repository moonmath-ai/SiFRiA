# Modified DMD configuration - keeping original settings to reproduce results
# Only changes: wandb config, log_iters (200), output_path, and absolute checkpoint path

generator_ckpt: /data/karthik_data/expt_2_1_1_3b_ode/checkpoint_model_002500/model.pt
output_path: /data/karthik_data/expt_2_1_1_3b_dmd
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: Wan2.1-T2V-14B
text_encoder_fsdp_wrap_strategy: size
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true # need to remove - 0 in denoising_step_list if warp_denoising_step is true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 5.0 # 3.0 default (data was gen with guidance scale 6.0)
max_grad_norm_generator: 1.0 #prevent exploding grads
max_grad_norm_critic: 1.0 #prevent exploding grads
denoising_loss_type: flow
mixed_precision: true
seed: 0
wandb_host: https://api.wandb.ai
wandb_key: ${WANDB_API_KEY}  # Set via environment variable for security
wandb_entity: lnm-
wandb_project: self_forcing_dmd_2.1_1.3b_new_params
sharding_strategy: hybrid_full
# EBS = 2 * 7 * 8 = 112, EBS/EBS_SF = 112/64 = 1.75, sqrt scaling (1.75)^(1/2) = 1.32
lr: 1.4e-06 # def: 2.0e-06 LR reset = 1.0e-06 , scalled LR  = 1.0e-06*1.32 rounded to 1.4e-06
lr_critic: 2.8e-06 #def 4.0e-07 LRcReset 2x LR = 2.0*e-06 . :LR'reset TTUR = 2.8e-06
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
data_path: prompts/vidprom_filtered_extended.txt
batch_size: 2
gradient_accumulation_steps: 8  # Effective batch size = 2 × 7 GPUs × 8 = 112
ema_weight: 0.99
ema_start_step: 200
# total_batch_size: 64 #not used: very confusing to add unused params
log_iters: 50
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 2 #5
image_or_video_shape:
- 1
- 21
- 16
- 60
- 104
distribution_loss: dmd
trainer: score_distillation
gradient_checkpointing: true
num_frame_per_block: 3
load_raw_video: false
prompt_name: Vidpromfilteredextended
prompt_path: prompts/vidprom_filtered_extended.txt
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 5
# Visualization
vis_interval: 50
vis_ema: false
vis_video_lengths: [21]
val_batch_size: 1
val_data_path: prompts/vidprom_filtered_extended.txt