# Configuration for ODE checkpoint validation
# This config contains all necessary parameters for ODERegression model

# Model architecture settings
model_kwargs:
  timestep_shift: 8.0

# Denoising settings - required by BaseModel
# NOTE: The mixkit_ode_lmdb dataset has only 4 denoising steps
denoising_step_list:
  - 1000
  - 750
  - 500
  - 250
warp_denoising_step: false  # ODE was trained without warping

# Training/inference settings
mixed_precision: true
gradient_checkpointing: false
i2v: false
num_frame_per_block: 3  # ODE was trained with block size 3 (from CausVid config)
independent_first_frame: false

# Checkpoint settings (optional, can be overridden via command line)
generator_ckpt: false

# Additional settings that may be referenced
seed: 0
weight_decay: 0.0


